# NER types: tier 2 quasi-identifiers (REQ-4) and tier 3 Article 9 special
# categories (REQ-3). Labels are the zero-shot prompts handed to the model;
# specificity stays below every catalog identifier (40-90) so a checksum-backed
# identifier wins a partial overlap with a model guess.
#
# BEFORE ADDING A DIGIT-SHAPED ENTITY HERE, READ THIS. The gateway refuses a
# request over a span found in a *numeric* JSON leaf only when the span's type
# is one of the eight in `identifiers.yaml`; a span of a type on this list is
# left alone there, because a model's label on a bare digit run is grounded in
# nothing. Not one of the types below has a digit-only realization today, which
# is what makes that split safe. A `TELEPHONE` added here — the gap the spec
# names as open — would be the first, and it would land on the non-refusing
# side with `make check-entity-types` passing and nobody having decided: that
# check holds the partition's shape, not its meaning. Adding one is a decision
# about the numeric predicate in `proxy::mask_all`, not only about this file.
entities:
  - entity_type: PERSON
    label: person
    # **0.5, and the number is measured rather than chosen.** A threshold is a
    # constant and the score it judges is not: the same name scores lower with
    # more text around it and lower again when other labels share the inference
    # call, so a bar set against isolated single-label text drops names in
    # every other shape. The gateway joins a document's leaves into one text
    # and asks three tier-2 labels at once, which is both shifts at once.
    #
    # Measured over the 130-document public corpus, entities counted as found
    # when any span covers them:
    #
    #   threshold   joined found   joined over-masked   separate found   over
    #        0.7        174               19                 183          33
    #        0.6        178               19                 184          33
    #        0.5        182               19                 185          34
    #        0.4        182               19                 185          36
    #
    # 0.5 recovers eight of the twelve detections joining costs, adds nothing
    # to over-masking on the joined path and one span on the separate one.
    # 0.4 buys nothing more and costs more, so this is an optimum rather than
    # the end of a range.
    #
    # The price, named because it is real: one span in sixty-eight becomes a
    # role phrase with no name in it — `Der Kunde`, which the trimming rule
    # keeps whole because emptying a span could unmask a name. It masks a
    # phrase nobody needed masked and does not save the name beside it. At 0.4
    # there are two; at 0.6 none, which is the other defensible answer.
    threshold: 0.5
    tier: 2
    specificity: 30
    # Words a person span may not begin with. The model reads `Der Kunde Karz`
    # and `Frau Martina Weber` as whole spans, so the same person arrives as two
    # different values across two turns and gets two placeholders — which is the
    # one thing the placeholder-stability argument exists to prevent.
    #
    # Measured over the public corpus: 19 of 76 annotated PERSON entities are
    # over-captured, all at the front, and 15 of those 19 are role nouns rather
    # than titles. A list of honorifics alone would have reached four.
    #
    # Matched case-insensitively with a trailing `.` stripped, so `Dr.` and `dr`
    # are one entry. PERSON alone carries this: LOCATION over-captures 0 of 8
    # and ORG 0 of 4.
    # **Articles are listed separately and are never trimmed on their own.**
    # `Le` is a Vietnamese family name and `Das` an Indian one, so trimming a
    # leading article by itself sends a real name component to the provider in
    # clear — `Le Thi Mai` would arrive as `Le [PERSON_1]`. An article only goes
    # when the word after it is itself trimmable, which is the only shape the
    # corpus ever shows: `Der Kunde`, `Le salarié`.
    trim_leading_articles:
      - der
      - die
      - das
      - le
      - la
    trim_leading:
      # role nouns, the larger half of the problem and the part that will need
      # adding to — `Patient`, `Versicherte`, `Bénéficiaire`, one per domain
      - kunde
      - kundin
      - mandant
      - mandantin
      - client
      - cliente
      - salarié
      - salariée
      # honorifics and salutations
      - herr
      - herrn
      - frau
      - madame
      - monsieur
      - dr
      - prof
      - sehr
      - geehrter
      - geehrte

  - entity_type: LOCATION
    label: location
    threshold: 0.7
    tier: 2
    specificity: 20

  - entity_type: ORG
    label: organization
    threshold: 0.75
    tier: 2
    specificity: 10

  # GDPR Article 9 special categories (REQ-3). These have no format, only
  # meaning, so the NER layer is the only thing that can find them — and the
  # sanctions behind them make a miss far worse than a false positive. Hence
  # tier 3 of their own and a threshold well below the quasi-identifiers'.
  # Specificity 35 puts them above PERSON/LOCATION/ORG and below every
  # checksum-backed identifier.
  - entity_type: HEALTH
    label: medical condition
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: BIOMETRIC
    label: biometric data
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: GENETIC
    label: genetic data
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: ETHNICITY
    label: ethnic origin
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: POLITICAL_AFFILIATION
    label: political party
    threshold: 0.30
    tier: 3
    specificity: 35

  # Article 9 protects political opinions, not only party membership: a stated
  # view that names no party needs a label of its own to have any chance.
  - entity_type: POLITICAL_OPINION
    label: political opinion
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: RELIGION
    label: religion
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: TRADE_UNION
    label: trade union
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: SEXUAL_ORIENTATION
    label: sexual orientation
    threshold: 0.30
    tier: 3
    specificity: 35

  # Article 9 names religious *or philosophical* beliefs, and sex life *or*
  # sexual orientation. Each pair is two clauses in the regulation, so each
  # gets its own label rather than being folded into its neighbour.
  - entity_type: PHILOSOPHICAL_BELIEF
    label: philosophical belief
    threshold: 0.30
    tier: 3
    specificity: 35

  - entity_type: SEX_LIFE
    label: sex life
    threshold: 0.30
    tier: 3
    specificity: 35
