[project]
name = "tessera-detector"
version = "0.1.0"
description = "Tessera PII detection service: deterministic recognizers with checksum validation, NER, context boosting"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.13.4",
    "python-stdnum>=2.2",
    "schwifty>=2026.7.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
tessera = "tessera_detector.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15",
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12",
]
eval = [
    "faker>=40",
]
ner = [
    "gliner>=0.2.22",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.28",
]

[build-system]
requires = ["uv_build>=0.7.3"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The scan report deliberately renders offset ranges with an en dash (12–27).
allowed-confusables = ["–"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["gliner.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ner: needs GLiNER weights (skipped when absent)"]
