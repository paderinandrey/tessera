[project]
name = "tessera-detector"
version = "0.1.0"
description = "Tessera PII detection service: deterministic recognizers with checksum validation, NER, context boosting"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.13.4",
    "python-stdnum>=2.2",
    "schwifty>=2026.7.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
tessera = "tessera_detector.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15",
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12",
]
eval = [
    "faker>=40",
]
serve = [
    "fastapi>=0.120",
    "uvicorn>=0.40",
    "httpx>=0.28",
]
ner = [
    "gliner>=0.2.22",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.28",
    # gliner's own dependency, named here only so the CPU-index pin below
    # reaches it: uv applies [tool.uv.sources] to direct dependencies, not to
    # transitive ones. The floor is the version gliner already resolved to.
    "torch>=2.13",
]

# gliner pulls in torch, and torch's default PyPI wheel for Linux drags the
# whole CUDA stack along with it — cuDNN, nccl, triton, the lot. The NER layer
# runs GLiNER through ONNX Runtime on CPU and never opens a GPU, so all of it
# is dead weight: it took the detector image to 5.34 GB. PyTorch's own CPU
# index carries the same version built without CUDA.
#
# Scoped to Linux on purpose. torch's macOS wheels are CPU-only on PyPI
# already — the CPU index serves the byte-identical file — so pointing macOS
# here too would only add a second host to trust for no change in what gets
# installed. `explicit = true` keeps everything but torch itself on PyPI.
#
# Two hosts, not one, and an egress allowlist needs to know which. The index
# below lists its wheels with absolute links to `download-r2.pytorch.org`, so
# every torch URL in uv.lock is on that host: a build — `uv sync --locked`,
# which is what the Dockerfile runs — contacts `download-r2.pytorch.org` only,
# and never the host named here. `download.pytorch.org` is contacted when the
# lock is regenerated (`uv lock`, `uv add`), to read that listing.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.7.3"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The scan report deliberately renders offset ranges with an en dash (12–27).
allowed-confusables = ["–"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["gliner.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ner: needs GLiNER weights (skipped when absent)",
]
