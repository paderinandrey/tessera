<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="470" viewBox="0 0 1200 470"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Tessera — a self-hosted privacy gateway for LLM traffic</title>
  <desc id="hero-desc">The same request in three states: your application sends a real
  Swiss IBAN, the provider receives the placeholder [IBAN_1] in its place, and your
  application gets the real IBAN back in the reply. Detected personal data is masked; what
  the gateway does not scan is listed in the README.</desc>

  <rect width="1200" height="470" rx="26" fill="#0B0C0E"/>

  <g id="title-block">
    <text x="64" y="92"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2.4" fill="#868C95">SELF-HOSTED PRIVACY GATEWAY</text>
    <text x="64" y="168"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="78" font-weight="700" fill="#F4F3EF">Tessera</text>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
       font-size="25" fill="#C9CDD3">
      <text x="560" y="106">Detected personal data is replaced with</text>
      <text x="560" y="142">placeholders, and restored in the reply.</text>
      <text x="560" y="186" fill="#868C95">Your application changes one thing — the base URL.</text>
    </g>
  </g>

  <g id="round-trip" transform="translate(64 244)">
    <rect width="1072" height="186" rx="14" fill="#131518" stroke="#262B31" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#868C95">
      <text x="32" y="54">your app sends</text>
      <text x="32" y="108">the provider sees</text>
      <text x="32" y="162">your app receives</text>
    </g>

    <line x1="286" y1="28" x2="286" y2="158" stroke="#262B31" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#F4F3EF">
      <text x="326" y="54">Meine IBAN lautet CH93 0076 2011 6238 5295 7</text>
      <text x="326" y="108">Meine IBAN lautet <tspan fill="#D6A94C">[IBAN_1]</tspan></text>
      <text x="326" y="162">Meine IBAN lautet CH93 0076 2011 6238 5295 7</text>
    </g>

    <rect x="306" y="88" width="4" height="26" rx="2" fill="#D6A94C"/>
    <text x="1040" y="108" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#D6A94C">leaves your perimeter</text>
  </g>
</svg>
