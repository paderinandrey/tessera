<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">What stays inside your perimeter, and what crosses it</title>
  <desc id="flow-desc">Your application, the Tessera gateway, the detector, the mapping
  table and the audit journal all run inside your perimeter. What crosses to the LLM
  provider is masked — a detected name goes out as a placeholder such as [PERSON_1] — and
  values are restored on the way back.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868C95"/>
    </marker>
    <marker id="arrow-token" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D6A94C"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0B0C0E"/>

  <text x="48" y="52"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" letter-spacing="2.4" fill="#868C95">YOUR PERIMETER</text>
  <rect x="48" y="68" width="812" height="300" rx="16"
        fill="none" stroke="#3A4046" stroke-width="1.5" stroke-dasharray="7 7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">
    <rect x="80" y="112" width="184" height="78" rx="12" fill="#131518" stroke="#262B31" stroke-width="1.5"/>
    <text x="172" y="158" text-anchor="middle" font-size="21" fill="#F4F3EF">your application</text>

    <rect x="372" y="112" width="220" height="78" rx="12" fill="#1A1D21" stroke="#3A4046" stroke-width="1.5"/>
    <text x="482" y="158" text-anchor="middle" fill="#F4F3EF">tessera gateway</text>

    <rect x="960" y="112" width="192" height="78" rx="12" fill="#131518" stroke="#262B31" stroke-width="1.5"/>
    <text x="1056" y="158" text-anchor="middle" fill="#F4F3EF">LLM provider</text>
  </g>

  <line x1="272" y1="151" x2="364" y2="151" stroke="#868C95" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="133" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#868C95">base URL</text>

  <line x1="596" y1="134" x2="952" y2="134" stroke="#D6A94C" stroke-width="2" marker-end="url(#arrow-token)"/>
  <text x="848" y="118" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="19" fill="#D6A94C">[PERSON_1]</text>

  <line x1="952" y1="176" x2="596" y2="176" stroke="#868C95" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848" y="202" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="19" fill="#868C95">restored on the way back</text>

  <text x="80" y="256"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#868C95">never leaves</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#C9CDD3">
    <rect x="80" y="274" width="236" height="68" rx="10" fill="#131518" stroke="#262B31" stroke-width="1.5"/>
    <text x="198" y="314" text-anchor="middle">the detector</text>

    <rect x="336" y="274" width="236" height="68" rx="10" fill="#131518" stroke="#262B31" stroke-width="1.5"/>
    <text x="454" y="314" text-anchor="middle">the mapping table</text>

    <rect x="592" y="274" width="236" height="68" rx="10" fill="#131518" stroke="#262B31" stroke-width="1.5"/>
    <text x="710" y="314" text-anchor="middle">the audit journal</text>
  </g>
</svg>
