# The gateway's configuration inside the compose stack. Three values differ
# from gateway/tessera.example.toml, and each has to:
#
#   - detector_url names the compose service, not loopback;
#   - audit_path points inside the audit volume, which is also where the
#     salt file lands — they must share one volume, because a journal with
#     lines and no salt beside it refuses to start;
#   - bind is 0.0.0.0, because a container that binds loopback is
#     unreachable from outside itself.

bind = "0.0.0.0:8080"
detector_url = "http://detector:8000"
detector_timeout_secs = 30

openai_base = "https://api.openai.com"
anthropic_base = "https://api.anthropic.com"

session_idle_secs = 1800
max_sessions = 1000
max_session_values = 1000

audit_path = "/var/lib/tessera/audit.jsonl"

# Spans are remembered by digest so a resent conversation is not rescanned.
# max_spans_per_entry bounds the other dimension: how large one remembered
# text's detection may be, so a single span-dense text cannot dominate the
# cache's memory the way an unbounded entry count alone would allow.
detection_cache_entries = 10000
max_spans_per_entry = 250

# How many characters of tool text (definitions, arguments and results,
# summed across one request) the gateway will hand to the detector. Characters
# rather than serialized bytes: braces, quotes and property names are structure
# the detector never reads, and on a real eight-tool payload the two differ by
# 1.49x, so charging structure refuses payloads a third below the ceiling it
# claims. 10 000 characters costs roughly eight to fifteen seconds depending on
# hardware -- that is the caller's wait, not a timeout budget, since
# detector_timeout_secs bounds each call rather than their sum. A larger tool
# result is refused, not served slowly. See gateway/tessera.example.toml for the
# measured sources and the full arithmetic.
max_tool_chars = 10000
# How many separate strings those structures may hold. A second bound because
# max_tool_chars bounds the wrong quantity for this failure: detection is one
# round-trip per string, awaited in turn, so cost tracks the number of strings
# rather than their total size. A schema of a thousand two-character strings is
# about 10000 bytes and a thousand sequential calls. 128 comes from counting a
# real eight-tool Claude Code payload, which needs 70. See
# gateway/tessera.example.toml for the count and what is still unmeasured.
max_tool_leaves = 128
