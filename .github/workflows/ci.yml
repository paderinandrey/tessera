name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # `CONTRIBUTING.md` requires every commit to carry a DCO sign-off and nothing
  # checked, so no commit ever did — zero of the twenty before this one. A rule
  # enforced by nobody reads as coverage without being any, which is the thing
  # this repository keeps flagging in its own code. See #51.
  #
  # Runs on the pull request's own commits rather than on `main`: squash-merge
  # composes its message from them, so a trailer here reaches `main` too, and
  # the attestation belongs to the contribution rather than to the merge.
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole range, not a shallow clone: a PR's commits are only
          # enumerable when their common ancestor with the base is present.
          fetch-depth: 0
      - name: Every commit carries a sign-off matching its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          # Merge commits are excluded: their authorship is the merger's, not a
          # contributor's, and the DCO certifies the contribution.
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%ae' "$commit")"
            signed="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")"
            subject="$(git show -s --format='%s' "$commit")"
            if [ -z "$signed" ]; then
              echo "::error::${commit:0:12} has no Signed-off-by trailer — $subject"
              failed=1
              continue
            fi
            # The sign-off certifies that *this author* has the right to submit
            # it, so a trailer naming someone else is not the attestation the
            # DCO asks for. Compared on the address, which is what identifies a
            # person here; display names vary between commits by one human.
            if ! printf '%s\n' "$signed" | grep -qiF "<$author>"; then
              echo "::error::${commit:0:12} is signed off by someone other than its author"
              echo "  author:   $author"
              echo "  trailers: $(printf '%s' "$signed" | tr '\n' ';')"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "Every commit must be signed off (CONTRIBUTING.md):"
            echo "    git commit -s          # on the next commit"
            echo "    git rebase --signoff \$BASE   # to add it to commits already made"
            exit 1
          fi
          echo "all commits signed off"

  detector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: detector
      - run: uv sync --locked --group serve
      - run: uv run pytest
      - run: uv run ruff check . ../evaluation
      - run: uv run mypy src
      # `uv sync --group serve` above installs the dev group too (uv's
      # default for a group literally named `dev`), so every step before
      # this one runs with pytest, mypy and ruff's own dependencies sitting
      # in the environment alongside detector's declared ones — exactly the
      # gap that let an undeclared `packaging` import ship, since pytest
      # pulled it in incidentally and nothing here noticed. This proves the
      # runtime resolves with nothing but [project.dependencies] installed,
      # in a scratch environment this target builds and tears down itself
      # rather than the one every step above shares.
      - run: make -C .. check-base-install
      # The gateway keeps its own copy of the entity-type vocabulary, because
      # asking the detector which types it emits would be worthless against a
      # detector that lies. The copy is only safe while something notices it
      # drifting.
      #
      # This step guards gateway/src/mapping.rs, not the detector, so this job
      # must not grow a `paths:` filter — a plausible `paths: detector/**` would
      # remove the guard on every pull request that only touches the gateway,
      # which is every pull request that can add a type to the list. The compose
      # job below shows this repository does gate jobs on conditions.
      #
      # Through the Makefile so the target cannot rot unnoticed: it is what a
      # developer runs, and what the failure message tells them to re-run.
      - run: make -C .. check-entity-types
      # Guards gateway/src/detector.rs, not the detector — so like the step
      # above, this job must not grow a `paths:` filter.
      - run: make -C .. check-layers
      # The committed corpus must regenerate byte-identical (seeded) — this
      # gates both generator determinism and corpus freshness.
      - run: uv run --group eval python ../evaluation/generate.py
      - run: git diff --exit-code ../evaluation/corpus
      # The committed OpenAPI document is the schema the gateway will read
      # (REQ-44); it must not drift from the application.
      - run: uv run --group serve python ../evaluation/export_openapi.py
      - run: git diff --exit-code ../docs/api
      # Tier 1 recall gate (REQ-38): exits non-zero below target. Runs without
      # NER weights, so it also exercises the deterministic-only fallback.
      - run: uv run python ../evaluation/evaluate.py

  ner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: detector
      - run: uv sync --locked --group ner --group serve
      # torch>=2.13 in the ner group is what makes the CPU-index pin apply —
      # uv resolves [tool.uv.sources] for a project's own requirements, not for
      # what they pull in transitively. Removing it silently restores a 4 GB
      # CUDA stack and `uv lock` reports success, so the property is asserted
      # rather than trusted to a comment.
      - run: uv run --locked --group ner --group serve python -c "import torch; assert torch.__version__.endswith('+cpu'), torch.__version__"
      - name: Cache NER weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/tessera/models
          # models.py carries the pinned HF revision, so its hash is the weight identity.
          key: ner-weights-${{ hashFiles('detector/src/tessera_detector/models.py') }}
      - run: make -C .. model
      # Model-backed tests plus the LOCATION precision gate (REQ-38).
      # --require-ner is what keeps this job honest: the marked tests skip when
      # the runtime is broken, so without it the job would pass green with the
      # NER layer entirely unusable.
      - run: uv run --group ner --group serve pytest -m ner
      - run: uv run --group ner python ../evaluation/evaluate.py --require-ner
      # Smoke only: the harness must run, but timings on a shared runner are
      # noise and are never asserted. Real numbers come from a known machine
      # and are recorded in the README with its hardware.
      - run: uv run --group ner python ../evaluation/benchmark.py --runs 3 --warmup 1

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      # --all-targets so test code is linted too: without it a stale
      # suppression in a test module survives every run, which is how one
      # lived from Task 3 to Task 5 on the detection-cache branch.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `ci` rather than `install`: it fails on a lockfile that disagrees with
      # the manifest instead of quietly resolving something else, which is the
      # difference between a build and a build of what was reviewed.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      # The client's types are generated from `docs/api/openapi.json`, which
      # this repository also generates and diffs in the `detector` job. Two
      # generated artifacts from one source drift in opposite directions
      # unless both are checked: `detector` holds the spec to the server, and
      # this holds the client to the spec.
      - run: npm run check:api
      - run: npm run build
      # The unit tests above run in jsdom. The Playwright suite is the only
      # thing that exercises a real browser, and it covers what jsdom cannot
      # answer: whether an astral character lands the highlight where the
      # detector said, whether the page keeps analysed text out of storage,
      # and whether the evidence colours survive dark mode. It was added with
      # the playground and nothing ran it, which is the same defect as having
      # no job at all, one script down.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    # Only on main: building a ~1 GB detector image on every pull request
    # costs more than this catches at that frequency, and the three jobs
    # above already gate the code itself.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: make compose-smoke
