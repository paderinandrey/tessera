# Tessera gateway configuration. Unknown keys are rejected: a typo in a
# security control must fail loudly rather than leave a default in place.

bind = "127.0.0.1:8080"
detector_url = "http://127.0.0.1:8000"

# Generous on purpose. Full detection costs about a second per 1 200 characters
# and a conversation history is longer than that; exceeding this refuses the
# request rather than forwarding unmasked text.
detector_timeout_secs = 30

openai_base = "https://api.openai.com"
anthropic_base = "https://api.anthropic.com"

# A conversation keeps one value on one placeholder when the client sends
# X-Tessera-Session. The table holds real values in memory between requests, so
# it is bounded three ways: how long a conversation survives without a request,
# how many conversations may hold a table, and how many values one may hold.
# Set session_idle_secs = 0 to disable sessions outright — personal data then
# never outlives the request that carried it, and a request that asks for a
# session is refused rather than quietly served without one.
session_idle_secs = 1800
max_sessions = 1000
max_session_values = 1000

# Where the audit journal is appended, one JSON object per line. Required: the
# gateway does not start without it. Two records per request — one written and
# fsynced before the provider is called, one when the request ends — and neither
# ever carries submitted text. A salt file is kept beside it as
# <audit_path>.salt; both hold evidence, they must stay together, and a journal
# whose salt has gone missing refuses to start rather than renumbering every
# tenant beneath you.
#
# This default is relative on purpose, so that following the quickstart writes
# where you ran it. A deployment wants an absolute path on storage you back up.
audit_path = "tessera-audit.jsonl"

# How many detection results the gateway may remember at once. Detection runs
# over every text on every request, and a client resends the whole conversation
# each turn, so without this a ten-turn conversation pays for its first turn ten
# times. Entries hold a digest of the text and the spans found in it — never the
# text itself — and are invalidated automatically when the detector's weights or
# catalogs change.
#
# This key bounds how many entries the cache holds, not how much memory it
# uses — that also depends on max_spans_per_entry below, since an entry's
# size is not fixed. Measured with a counting allocator: an entry costs 264
# bytes fixed plus 46 per span found in the text, a floor, since that counts
# only requested bytes and neither malloc rounding nor HashMap slack. Zero
# disables the cache: the gateway then calls the detector for every text, as
# it did before the cache existed.
detection_cache_entries = 10000

# The cache's other dimension: how many spans a single detection may carry
# and still be remembered. Without this, one span-dense text could dominate
# the cache's memory on its own, and nothing above bounds how many spans one
# text may have. A detection over this cap is masked, restored and returned
# exactly like any other; it is simply not stored, so an oversized result
# never becomes a refusal, only a permanent miss.
#
# 250, chosen from measured density rather than assumed: real text runs
# roughly 1.0 to 2.5 spans per 1000 characters (git log --stat 1.33, README
# prose 2.50, Rust source 1.00 — a synthetic dense-PII detection corpus
# measured 28.67, but that corpus is a proxy for nothing outside itself). 250
# spans covers prose to about 100 KB, logs to about 188 KB and source to
# 250 KB — every realistic single tool result — while a lower cap would trim
# the longest, most expensive-to-recompute texts first, the wrong end to trim
# on a number that would otherwise be arbitrary.
#
# A uniformly dense text crosses the cap at single-digit kilobytes, and that
# is a limit rather than a number to keep raising. The densities above are
# code, logs and prose — the shapes a coding agent sends. A contact list or
# an intake form is not shaped like either. The only dense-PII sample in
# this repository is the evaluation corpus, which annotates about 20 spans per
# 1000 characters across the whole file and about 30 across its eighty
# non-negative rows; a real contact row, at roughly five entities in eighty
# characters, exceeds both. It characterises nothing about a buyer's
# traffic and is not offered as doing so — it is an illustration of where
# the cap lands on text that is dense throughout. It cannot be more than
# that: every row of that corpus is a single rendered sentence under 126
# characters, so nothing in this repository is shaped like a client
# document. The figure is an illustration awaiting its measurement.
#
# At that density a single text crosses 250 spans somewhere between 8 and
# 16 KB, so a uniformly dense document arriving as one message is declined
# and rescanned on every turn. Two things bound how often that bites: the
# cache keys per text rather than per document, so a conversation about a
# dense file is many short turns that all cache normally; and a long
# document is rarely uniform — a contract with personal data in its header
# and signature block is prose in between. Ordinary correspondence is
# prose-shaped at nearer 2.5 spans per 1000 and is not affected.
#
# Raising the cap for a deployment whose texts really are dense throughout
# is a deliberate lever with a priced cost — the formula is in front of the
# operator — but it cannot be the default, because the same number
# multiplies against ten thousand entries.
#
# At the shipped defaults, the worst case is entries * (264 + spans * 46) =
# 10000 * (264 + 250 * 46) = 117640000 B ≈ 118 MB — three times below the
# figure that would have blocked this cache from shipping, and reachable
# only with ten thousand simultaneously resident maximum-size entries. A
# deployment whose texts really are dense throughout should raise this
# figure and recompute the worst case above against its own texts. Zero is
# rejected while the cache is enabled — an entry cap of zero would remember
# nothing, which is what detection_cache_entries = 0 already says more
# directly.
#
# The 46 B/span above measured real detector output; it bounded no single
# span's type on its own, so one span with a very large type still passed
# this count cap and was retained in full. The gateway now declines any
# entry containing a span whose type is longer than the placeholder grammar
# allows (40 bytes), so a span's true worst-case weight is nearer 80 B and
# the figure above holds as a typical case rather than an assumed ceiling —
# the true ceiling is nearer 200 MB at these defaults.
max_spans_per_entry = 250

# How many characters of text — every tool definition, call argument and
# result, summed across one request — may be handed to the detector.
#
# Characters, not serialized bytes. Cost scales with the text the detector
# reads; braces, quotes and property names are structure it never sees. On the
# real ten-tool payload in gateway/src/testdata/claude_code_tools.json the two
# differ by 1.43x — 13 177 serialized against 9 193 charged.
#
# Set from that measurement, at twice it. Ten real tool definitions charge 9 193
# characters: 9 005 of text, 50 of numbers, and 138 of the separators the join
# inserts between leaves, every one of which the detector reads. Those ten are a
# floor: a stock session carries about fifteen tools, extrapolating to roughly
# 13 800, so 20 000 covers a stock session with room for a small MCP server and
# does not pretend to cover an arbitrary one. The test
# a_real_tool_payload_fits_the_bounds_this_gateway_ships_with pins the figure and
# fails if this default stops admitting twice it.
#
# What that costs. Two things were offered as making it tolerable: it is the
# FIRST turn of a session only, since tool definitions are byte-identical
# afterwards and the detection cache serves them; and the alternative is not a
# faster gateway but a refused one, because a bound below real traffic makes
# this unusable with the clients it exists for.
#
# NOTHING BOUNDS A REQUEST'S WALL CLOCK, and the caller's patience is not ours
# to set. Whatever this number permits is what the caller waits, and the caller
# has its own timeout that this gateway neither sees nor controls. At thirty
# seconds a client is inside these figures by a hair; at twenty it gives up
# first and the failure arrives on its side looking like an outage here. No
# cumulative deadline exists anywhere on the request path that would turn that
# into an honest refusal instead.
#
# THE CONTAINERISED COST IS MEASURED, NOT DERIVED. The 77 leaves of the real
# ten-tool payload were replayed through /detect in sequence, three times,
# salted so nothing could come from a cache: 54.9 s median, about 700 ms a leaf.
# That is a session's first turn with a real tool set. A single call costs
# 265-410 ms whatever its length, so per-call overhead is the majority of it.
#
# That measurement is what BATCHING was built on, and it describes the cost that
# no longer applies: a document's leaves are one call now, so the same payload is
# 20 calls rather than 77. The 57 calls that went away were 265-410 ms each --
# fifteen to twenty-three seconds of pure overhead, derived from the two
# measurements either side of it. The post-batching wall clock has not been
# re-replayed.
#
# The first version of this figure was DERIVED -- characters over a throughput
# taken from 1 200- and 6 000-character texts, applied to leaves averaging 116,
# where overhead dominates and throughput barely applies. It could have been out
# by a factor of five and nothing in it would have said so. It landed within 5%
# of the replay, which is luck rather than method.
#
# THE NATIVE FIGURE BELOW IS STILL DERIVED and is labelled so, because it cannot
# be measured here: the host detector/.venv has no onnxruntime, so its /health
# reports ner: false and it runs the deterministic layer alone. Derived: about
# 15 s, from the README bench's 80-character row (109 ms, per-call cost and
# almost nothing else) plus its 1 200-character row for the marginal rate. An
# estimate until someone runs the replay on a host with the NER extras.
#
# The number was NOT lowered on the strength of that evidence: a bound below
# real traffic turns a long wait into a refusal of a client that did nothing
# wrong. One call per document instead of one per string was the fix, and it has
# landed; what is left for issue #28 is making detection fast on a large text,
# which is a different problem and not a number here. 20 000 rather than 18 000
# because the headroom rule is now asserted rather than described, and 18 000
# failed it by ten characters.
#
# It is NOT a timeout budget, and this comment used to say it was.
# detector_timeout_secs becomes reqwest's per-request timeout, so it bounds each
# detector call on its own and never their sum; no cumulative deadline exists
# anywhere on the request path. Two constraints: the timeout catches a stuck
# call, this caps how long a caller waits for the whole request.
max_tool_chars = 20000

# How many detector round-trips those structures may need.
#
# One per tool description and one per schema holding any text at all: a
# document's leaves are detected in a SINGLE call, so a schema of a thousand
# short strings costs one round-trip rather than a thousand.
#
# This key was max_tool_leaves and counted strings, because detection really was
# one call per string. Batching changed the unit, not the failure: an unbounded
# number of sequential calls is still what this stops, and max_tool_chars does
# not stop it -- ten thousand definitions each with a one-character description
# are ten thousand characters, inside that bound, and ten thousand calls.
#
# Set from measurement at twice the measured payload, the same rule
# max_tool_chars uses. The real ten-tool payload needs 20 calls -- ten
# descriptions and ten schemas -- where it needed 77 strings before. The test
# a_real_tool_payload_fits_the_bounds_this_gateway_ships_with pins that and
# fails if this default stops admitting twice it.
#
# A call costs 265-410 ms against the compose detector and 109 ms natively,
# because the price is paid per inference pass rather than per character. At 40
# that is about sixteen seconds of overhead containerised, against 63 before
# batching.
max_tool_calls = 40
